<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c46">
  <meta name="description" content="今月あといくら使えるかがすぐ分かる、シンプルな家計簿Webアプリ">
  <title>あといくら｜月の家計簿</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5ef;
      --surface: #fffefa;
      --ink: #18221c;
      --muted: #69736c;
      --line: #d7dbd4;
      --line-strong: #aeb7af;
      --pine: #1f5c46;
      --pine-soft: #dce9e1;
      --sun: #e7b94d;
      --alert: #c64f36;
      --alert-soft: #f4dfd8;
      --focus: #2b69c9;
      --content: 1120px;
      --radius: 10px;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(to right, transparent 0, transparent calc(100% - 1px), rgba(24, 34, 28, 0.025) calc(100% - 1px)) 0 0 / 24px 100%,
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 76%, white);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 10px;
      left: 10px;
      padding: 10px 14px;
      color: white;
      background: var(--ink);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: var(--content);
      min-height: 64px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 8px;
      height: 28px;
      background: var(--sun);
      transform: skewY(-18deg);
    }

    .brand-name {
      display: block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .brand-note {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .month-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .month-title {
      min-width: 106px;
      text-align: center;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .icon-button,
    .text-button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      font-size: 22px;
    }

    .icon-button:hover,
    .text-button:hover {
      background: rgba(31, 92, 70, 0.07);
    }

    .settings-trigger {
      justify-self: end;
      padding: 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(300px, 0.82fr) minmax(0, 1.4fr);
      gap: 0 56px;
      width: min(calc(100% - 48px), var(--content));
      margin: 0 auto;
      padding: 46px 0 120px;
    }

    .overview-column {
      align-self: start;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--pine);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .remaining-block {
      position: relative;
      padding: 0 0 30px;
      border-bottom: 1px solid var(--line-strong);
    }

    .remaining-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .budget-edit {
      min-height: 44px;
      padding: 0 4px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .remaining-amount {
      margin: 8px 0 2px;
      font-family: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: clamp(52px, 7vw, 76px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .remaining-amount.is-over {
      color: var(--alert);
    }

    .remaining-unit {
      margin-left: 5px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .remaining-context {
      min-height: 24px;
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .remaining-context strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .pace {
      padding: 25px 0 28px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .pace-track-wrap {
      margin-top: 25px;
      padding-top: 22px;
    }

    .pace-track {
      position: relative;
      height: 11px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      background:
        repeating-linear-gradient(to right, transparent 0, transparent calc(10% - 1px), rgba(24, 34, 28, 0.18) calc(10% - 1px), rgba(24, 34, 28, 0.18) 10%);
    }

    .pace-fill {
      position: absolute;
      inset: -1px auto -1px 0;
      width: 0;
      max-width: 100%;
      background: var(--pine);
      transition: width 240ms ease-out;
    }

    .pace-fill.is-over {
      background: var(--alert);
    }

    .today-marker {
      position: absolute;
      z-index: 2;
      top: -24px;
      width: 1px;
      height: 34px;
      border-left: 1px dashed var(--ink);
    }

    .today-marker::before {
      content: "今日";
      position: absolute;
      top: -3px;
      left: 50%;
      padding: 0 3px;
      color: var(--ink);
      background: var(--paper);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      transform: translate(-50%, -100%);
    }

    .pace-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: var(--muted);
      font-family: "Avenir Next", sans-serif;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .pace-message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .pace-signal {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      margin-top: 6px;
      background: var(--sun);
      transform: rotate(45deg);
    }

    .pace-message.is-over .pace-signal {
      background: var(--alert);
    }

    .quick-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .quick-stat {
      min-width: 0;
      padding: 22px 10px 21px 0;
    }

    .quick-stat + .quick-stat {
      padding-left: 15px;
      border-left: 1px solid var(--line);
    }

    .quick-stat-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .quick-stat-value {
      display: block;
      overflow: hidden;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .categories {
      padding-top: 28px;
    }

    .category-list {
      display: grid;
      gap: 20px;
      margin: 21px 0 0;
      padding: 0;
      list-style: none;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(76px, 0.8fr) minmax(84px, 1.2fr) auto;
      align-items: center;
      gap: 12px;
    }

    .category-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .category-swatch {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      background: var(--category-color);
    }

    .category-bar {
      overflow: hidden;
      height: 5px;
      background: var(--line);
    }

    .category-bar > span {
      display: block;
      width: var(--category-width);
      height: 100%;
      background: var(--category-color);
    }

    .category-amount {
      min-width: 68px;
      text-align: right;
      font-family: "Avenir Next", sans-serif;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .ledger-column {
      min-width: 0;
      padding-top: 2px;
    }

    .ledger-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--ink);
    }

    .ledger-title {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .ledger-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .filters {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 2px 0 0;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;
      min-height: 47px;
      padding: 2px 0 0;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-button[aria-pressed="true"] {
      border-bottom-color: var(--pine);
      color: var(--ink);
    }

    .transaction-groups {
      min-height: 360px;
    }

    .date-group {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      border-bottom: 1px solid var(--line-strong);
    }

    .date-heading {
      margin: 0;
      padding: 22px 12px 22px 0;
      color: var(--muted);
      font-family: "Avenir Next", sans-serif;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
    }

    .date-heading strong {
      display: block;
      color: var(--ink);
      font-size: 22px;
      font-weight: 600;
    }

    .transactions {
      margin: 0;
      padding: 0;
      border-left: 1px solid var(--line);
      list-style: none;
    }

    .transaction-item + .transaction-item {
      border-top: 1px solid var(--line);
    }

    .transaction-button {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 70px;
      padding: 12px 0 12px 20px;
      border: 0;
      text-align: left;
      background: transparent;
      cursor: pointer;
    }

    .transaction-button:hover {
      background: rgba(31, 92, 70, 0.045);
    }

    .transaction-mark {
      width: 8px;
      height: 8px;
      background: var(--category-color);
    }

    .transaction-content {
      min-width: 0;
    }

    .transaction-name {
      display: block;
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transaction-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .transaction-amount {
      padding-right: 5px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .transaction-amount.is-income {
      color: var(--pine);
    }

    .empty-state {
      padding: 72px 16px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .empty-state-mark {
      display: block;
      width: 38px;
      height: 48px;
      margin: 0 auto 18px;
      border: 1px solid var(--line-strong);
      border-top: 6px solid var(--sun);
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 9px, var(--line) 9px, var(--line) 10px);
    }

    .empty-state h3 {
      margin: 0;
      font-size: 16px;
    }

    .empty-state p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .add-dock {
      position: static;
      z-index: 30;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 1px;
      border: 1px solid color-mix(in srgb, var(--pine) 70%, black);
      background: var(--pine);
    }

    .add-primary,
    .add-secondary {
      min-height: 52px;
      border: 0;
      color: white;
      background: transparent;
      font-weight: 800;
      cursor: pointer;
    }

    .add-primary {
      min-width: 148px;
      padding: 0 20px;
      font-size: 14px;
      letter-spacing: 0.03em;
    }

    .add-secondary {
      min-width: 52px;
      border-left: 1px solid rgba(255, 255, 255, 0.26);
      font-size: 20px;
    }

    .add-primary:hover,
    .add-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    dialog {
      width: min(calc(100% - 28px), 500px);
      max-height: min(820px, calc(100dvh - 28px));
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 20px 70px rgba(24, 34, 28, 0.2);
    }

    dialog::backdrop {
      background: rgba(18, 28, 22, 0.48);
      backdrop-filter: blur(2px);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 0 12px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      margin: 0;
      font-size: 17px;
    }

    .dialog-body {
      overflow-y: auto;
      max-height: calc(100dvh - 120px);
      padding: 22px;
    }

    .type-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 23px;
      border-bottom: 1px solid var(--line);
    }

    .type-button {
      min-height: 48px;
      padding: 0 14px;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .type-button[aria-pressed="true"] {
      border-bottom-color: var(--pine);
      color: var(--ink);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .field-label,
    .fieldset-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .amount-field-wrap {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      border-bottom: 2px solid var(--ink);
    }

    .currency-symbol,
    .amount-suffix {
      padding-bottom: 10px;
      font-family: "Avenir Next", sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .amount-input {
      min-width: 0;
      height: 58px;
      padding: 0 10px;
      border: 0;
      outline: 0;
      font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
      font-size: 38px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      background: transparent;
    }

    .text-input,
    .date-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      color: var(--ink);
      background: white;
    }

    .text-input::placeholder {
      color: #929a94;
    }

    fieldset {
      margin: 0 0 20px;
      padding: 0;
      border: 0;
    }

    .category-choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .category-choice {
      display: grid;
      place-items: center;
      min-height: 54px;
      padding: 7px 4px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .category-choice::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-bottom: 5px;
      background: var(--category-color);
    }

    .category-choice[aria-pressed="true"] {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--paper);
      box-shadow: inset 0 -3px 0 var(--category-color);
    }

    .form-error {
      min-height: 20px;
      margin: -8px 0 12px;
      color: var(--alert);
      font-size: 12px;
      font-weight: 700;
    }

    .dialog-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 4px;
    }

    .primary-button,
    .danger-button,
    .quiet-button {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button {
      border: 1px solid var(--pine);
      color: white;
      background: var(--pine);
    }

    .primary-button:hover {
      background: #174a37;
    }

    .quiet-button {
      border: 1px solid var(--line-strong);
      background: transparent;
    }

    .danger-button {
      margin-right: auto;
      border: 1px solid var(--alert);
      color: var(--alert);
      background: transparent;
    }

    .danger-button[hidden] {
      display: none;
    }

    .settings-copy {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .settings-hint {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: 96px;
      max-width: calc(100% - 32px);
      padding: 12px 16px;
      border-left: 5px solid var(--sun);
      color: white;
      background: var(--ink);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      body {
        background: var(--paper);
      }

      .topbar-inner {
        grid-template-columns: auto 1fr auto;
        min-height: 58px;
        padding: 0 10px 0 16px;
      }

      .brand-note {
        display: none;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-mark {
        height: 23px;
      }

      .month-switcher {
        justify-self: center;
      }

      .month-title {
        min-width: 86px;
        font-size: 13px;
      }

      .settings-trigger {
        width: 44px;
        overflow: hidden;
        padding: 0;
        font-size: 0;
      }

      .settings-trigger::before {
        content: "予算";
        font-size: 11px;
      }

      .dashboard {
        display: block;
        width: 100%;
        padding: 28px 20px 116px;
      }

      .remaining-amount {
        font-size: clamp(51px, 16vw, 68px);
      }

      .categories {
        padding-bottom: 38px;
      }

      .ledger-header {
        padding-top: 4px;
      }

      .ledger-title {
        font-size: 25px;
      }

      .date-group {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .date-heading {
        padding-right: 8px;
        font-size: 10px;
      }

      .date-heading strong {
        font-size: 18px;
      }

      .transaction-button {
        min-height: 68px;
        padding-left: 14px;
      }

      .add-dock {
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 12px;
      }

      .add-primary {
        flex: 1;
      }

      .toast {
        bottom: 84px;
      }
    }

    @media (max-width: 430px) {
      .dashboard {
        padding-right: 17px;
        padding-left: 17px;
      }

      .remaining-block {
        padding-bottom: 25px;
      }

      .pace {
        padding-top: 22px;
      }

      .quick-stat {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .quick-stat + .quick-stat {
        padding-left: 10px;
      }

      .quick-stat-label {
        font-size: 10px;
      }

      .quick-stat-value {
        font-size: 15px;
      }

      .category-choices {
        grid-template-columns: repeat(3, 1fr);
      }

      dialog {
        width: 100%;
        max-width: none;
        max-height: calc(100dvh - 8px);
        margin: auto 0 0;
        border-width: 1px 0 0;
        border-radius: 14px 14px 0 0;
      }

      .dialog-body {
        max-height: calc(100dvh - 70px);
        padding: 20px 17px calc(20px + env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">内容へ移動</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="あといくら 月の家計簿">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <span class="brand-name">あといくら</span>
          <span class="brand-note">月の家計簿</span>
        </span>
      </div>

      <div class="month-switcher" aria-label="表示する月を変更">
        <button class="icon-button" id="prev-month" type="button" aria-label="前の月">‹</button>
        <span class="month-title" id="month-title"></span>
        <button class="icon-button" id="next-month" type="button" aria-label="次の月">›</button>
      </div>

      <button class="text-button settings-trigger" id="settings-trigger" type="button" aria-label="予算設定">予算設定</button>
    </div>
  </header>

  <main class="dashboard" id="main">
    <div class="overview-column">
      <section aria-labelledby="remaining-title">
        <p class="eyebrow" id="overview-eyebrow">今月の予算</p>
        <div class="remaining-block">
          <p class="remaining-label" id="remaining-title">
            <span id="remaining-label-text">あと使える金額</span>
            <button class="text-button budget-edit" id="budget-edit" type="button">予算を変える</button>
          </p>
          <p class="remaining-amount" id="remaining-amount" aria-live="polite"></p>
          <p class="remaining-context" id="remaining-context"></p>
        </div>
      </section>

      <section class="pace" aria-labelledby="pace-title">
        <div class="section-heading-row">
          <h2 class="section-heading" id="pace-title">今月のペース</h2>
          <p class="section-note" id="pace-ratio"></p>
        </div>
        <div class="pace-track-wrap">
          <div class="pace-track" id="pace-track" role="img" aria-label="予算の使用状況">
            <span class="pace-fill" id="pace-fill"></span>
            <span class="today-marker" id="today-marker"></span>
          </div>
          <div class="pace-axis" aria-hidden="true">
            <span>月初</span>
            <span>1/2</span>
            <span>月末</span>
          </div>
        </div>
        <p class="pace-message" id="pace-message">
          <span class="pace-signal" aria-hidden="true"></span>
          <span id="pace-message-text"></span>
        </p>
      </section>

      <section class="quick-stats" aria-label="今月の要約">
        <div class="quick-stat">
          <span class="quick-stat-label">使った金額</span>
          <strong class="quick-stat-value" id="expense-total"></strong>
        </div>
        <div class="quick-stat">
          <span class="quick-stat-label">1日あたり</span>
          <strong class="quick-stat-value" id="daily-budget"></strong>
        </div>
        <div class="quick-stat">
          <span class="quick-stat-label">記録件数</span>
          <strong class="quick-stat-value" id="transaction-count"></strong>
        </div>
      </section>

      <section class="categories" aria-labelledby="categories-title">
        <div class="section-heading-row">
          <h2 class="section-heading" id="categories-title">支出の内訳</h2>
          <p class="section-note" id="category-note"></p>
        </div>
        <ol class="category-list" id="category-list"></ol>
      </section>
    </div>

    <section class="ledger-column" id="ledger" aria-labelledby="ledger-title">
      <header class="ledger-header">
        <h1 class="ledger-title" id="ledger-title">お金の記録</h1>
        <span class="ledger-count" id="ledger-count"></span>
        <div class="add-dock" aria-label="記録を追加">
          <button class="add-primary" id="add-expense" type="button">支出を記録する</button>
          <button class="add-secondary" id="add-income" type="button" aria-label="収入を記録する">＋</button>
        </div>
      </header>
      <nav class="filters" id="filters" aria-label="記録の絞り込み"></nav>
      <div class="transaction-groups" id="transaction-groups"></div>
    </section>
  </main>

  <dialog id="entry-dialog" aria-labelledby="entry-dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="entry-dialog-title">支出を記録</h2>
      <button class="icon-button" id="entry-close" type="button" aria-label="閉じる">×</button>
    </div>
    <form class="dialog-body" id="entry-form" novalidate>
      <div class="type-switch" aria-label="記録の種類">
        <button class="type-button" id="type-expense" type="button" aria-pressed="true">支出</button>
        <button class="type-button" id="type-income" type="button" aria-pressed="false">収入</button>
      </div>

      <div class="field">
        <label class="field-label" for="amount">金額</label>
        <div class="amount-field-wrap">
          <span class="currency-symbol" aria-hidden="true">¥</span>
          <input class="amount-input" id="amount" name="amount" type="text" inputmode="numeric" autocomplete="off" aria-describedby="form-error" required>
          <span class="amount-suffix" aria-hidden="true">円</span>
        </div>
      </div>

      <fieldset>
        <legend class="fieldset-label">カテゴリ</legend>
        <div class="category-choices" id="category-choices"></div>
      </fieldset>

      <div class="field">
        <label class="field-label" for="memo">内容</label>
        <input class="text-input" id="memo" name="memo" type="text" maxlength="40" autocomplete="off" placeholder="例：スーパー、電車、ランチ">
      </div>

      <div class="field">
        <label class="field-label" for="date">日付</label>
        <input class="date-input" id="date" name="date" type="date" required>
      </div>

      <p class="form-error" id="form-error" role="alert"></p>

      <div class="dialog-actions">
        <button class="danger-button" id="delete-entry" type="button" hidden>削除</button>
        <button class="quiet-button" id="entry-cancel" type="button">キャンセル</button>
        <button class="primary-button" id="entry-submit" type="submit">記録する</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
    <div class="dialog-header">
      <h2 class="dialog-title" id="settings-dialog-title">月の予算</h2>
      <button class="icon-button" id="settings-close" type="button" aria-label="閉じる">×</button>
    </div>
    <form class="dialog-body" id="settings-form" novalidate>
      <p class="settings-copy" id="settings-copy">今月、生活費として使ってよい金額を設定します。収入とは別に考えると、残りが分かりやすくなります。</p>
      <div class="field">
        <label class="field-label" for="budget">予算</label>
        <div class="amount-field-wrap">
          <span class="currency-symbol" aria-hidden="true">¥</span>
          <input class="amount-input" id="budget" name="budget" type="text" inputmode="numeric" autocomplete="off" aria-describedby="budget-hint settings-error" required>
          <span class="amount-suffix" aria-hidden="true">円</span>
        </div>
      </div>
      <p class="settings-hint" id="budget-hint">家賃を予算に含めるかどうかは、毎月同じ基準にすると比較しやすくなります。</p>
      <p class="form-error" id="settings-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="quiet-button" id="settings-cancel" type="button">キャンセル</button>
        <button class="primary-button" type="submit">予算を保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "atoikura-v1";
      const numberFormatter = new Intl.NumberFormat("ja-JP");
      const dateFormatter = new Intl.DateTimeFormat("ja-JP", { weekday: "short" });

      const expenseCategories = {
        food: { label: "食費", color: "#d9a526" },
        daily: { label: "日用品", color: "#5f8b72" },
        transport: { label: "交通", color: "#4f748b" },
        housing: { label: "住まい", color: "#8a7060" },
        fun: { label: "楽しみ", color: "#c46b53" },
        health: { label: "からだ", color: "#756a92" },
        other: { label: "その他", color: "#747c76" }
      };

      const incomeCategories = {
        salary: { label: "給与", color: "#1f5c46" },
        bonus: { label: "臨時収入", color: "#397c5f" },
        refund: { label: "返金", color: "#5f8b72" },
        otherIncome: { label: "その他", color: "#747c76" }
      };

      const elements = {
        monthTitle: document.querySelector("#month-title"),
        overviewEyebrow: document.querySelector("#overview-eyebrow"),
        remainingLabel: document.querySelector("#remaining-label-text"),
        remainingAmount: document.querySelector("#remaining-amount"),
        remainingContext: document.querySelector("#remaining-context"),
        paceFill: document.querySelector("#pace-fill"),
        todayMarker: document.querySelector("#today-marker"),
        paceTrack: document.querySelector("#pace-track"),
        paceRatio: document.querySelector("#pace-ratio"),
        paceMessage: document.querySelector("#pace-message"),
        paceMessageText: document.querySelector("#pace-message-text"),
        expenseTotal: document.querySelector("#expense-total"),
        dailyBudget: document.querySelector("#daily-budget"),
        transactionCount: document.querySelector("#transaction-count"),
        categoryNote: document.querySelector("#category-note"),
        categoryList: document.querySelector("#category-list"),
        ledgerCount: document.querySelector("#ledger-count"),
        filters: document.querySelector("#filters"),
        transactionGroups: document.querySelector("#transaction-groups"),
        entryDialog: document.querySelector("#entry-dialog"),
        entryDialogTitle: document.querySelector("#entry-dialog-title"),
        entryForm: document.querySelector("#entry-form"),
        amount: document.querySelector("#amount"),
        memo: document.querySelector("#memo"),
        date: document.querySelector("#date"),
        categoryChoices: document.querySelector("#category-choices"),
        typeExpense: document.querySelector("#type-expense"),
        typeIncome: document.querySelector("#type-income"),
        entrySubmit: document.querySelector("#entry-submit"),
        deleteEntry: document.querySelector("#delete-entry"),
        formError: document.querySelector("#form-error"),
        settingsDialog: document.querySelector("#settings-dialog"),
        settingsCopy: document.querySelector("#settings-copy"),
        settingsForm: document.querySelector("#settings-form"),
        budget: document.querySelector("#budget"),
        settingsError: document.querySelector("#settings-error"),
        toast: document.querySelector("#toast")
      };

      let state = loadState();
      let viewDate = startOfMonth(new Date());
      let activeFilter = "all";
      let entryType = "expense";
      let selectedCategory = "food";
      let editingId = null;
      let toastTimer = null;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function toDateString(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      function monthKey(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
      }

      function startOfMonth(date) {
        return new Date(date.getFullYear(), date.getMonth(), 1);
      }

      function daysInMonth(date) {
        return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      }

      function dateInCurrentMonth(day) {
        const now = new Date();
        return toDateString(new Date(now.getFullYear(), now.getMonth(), Math.max(1, Math.min(day, daysInMonth(now)))));
      }

      function createSeedState() {
        const now = new Date();
        const day = now.getDate();
        const sample = [
          { offset: 0, amount: 1280, category: "food", memo: "スーパー" },
          { offset: 0, amount: 520, category: "transport", memo: "電車" },
          { offset: 1, amount: 980, category: "food", memo: "ランチ" },
          { offset: 2, amount: 2480, category: "daily", memo: "洗剤と日用品" },
          { offset: 4, amount: 1600, category: "fun", memo: "映画" },
          { offset: 6, amount: 4200, category: "food", memo: "週末の買い出し" },
          { offset: 9, amount: 780, category: "health", memo: "薬局" }
        ];

        const transactions = sample.map((item, index) => ({
          id: `sample-${index}`,
          type: "expense",
          amount: item.amount,
          category: item.category,
          memo: item.memo,
          date: dateInCurrentMonth(Math.max(1, day - item.offset)),
          createdAt: Date.now() - index
        }));

        transactions.push({
          id: "sample-income",
          type: "income",
          amount: 248000,
          category: "salary",
          memo: "給与",
          date: dateInCurrentMonth(1),
          createdAt: Date.now() - 20
        });

        return {
          budgets: { [monthKey(now)]: 180000 },
          transactions
        };
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return createSeedState();
          const parsed = JSON.parse(stored);
          if (!parsed || typeof parsed !== "object") return createSeedState();
          return {
            budgets: parsed.budgets && typeof parsed.budgets === "object" ? parsed.budgets : {},
            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : []
          };
        } catch (error) {
          return createSeedState();
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function formatYen(value, withSymbol = true) {
        const rounded = Math.round(Math.abs(Number(value) || 0));
        return `${withSymbol ? "¥" : ""}${numberFormatter.format(rounded)}`;
      }

      function parseAmount(value) {
        return Number(String(value).replace(/[^0-9]/g, ""));
      }

      function currentBudget() {
        const key = monthKey(viewDate);
        const value = Number(state.budgets[key]);
        return Number.isFinite(value) && value > 0 ? value : 180000;
      }

      function transactionsForView() {
        const key = monthKey(viewDate);
        return state.transactions
          .filter((item) => typeof item.date === "string" && item.date.startsWith(key))
          .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
      }

      function categoryFor(item) {
        const source = item.type === "income" ? incomeCategories : expenseCategories;
        return source[item.category] || { label: "その他", color: "#747c76" };
      }

      function isCurrentCalendarMonth() {
        const now = new Date();
        return now.getFullYear() === viewDate.getFullYear() && now.getMonth() === viewDate.getMonth();
      }

      function render() {
        const list = transactionsForView();
        const expenses = list.filter((item) => item.type === "expense");
        const income = list.filter((item) => item.type === "income");
        const expenseTotal = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const incomeTotal = income.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const budget = currentBudget();
        const remaining = budget - expenseTotal;
        const monthDays = daysInMonth(viewDate);
        const currentMonth = isCurrentCalendarMonth();
        const elapsedDays = currentMonth ? new Date().getDate() : monthDays;
        const daysLeft = currentMonth ? Math.max(1, monthDays - elapsedDays + 1) : 0;
        const spentRatio = budget > 0 ? expenseTotal / budget : 0;
        const elapsedRatio = elapsedDays / monthDays;
        const paceAllowance = budget * elapsedRatio;
        const paceGap = paceAllowance - expenseTotal;

        elements.monthTitle.textContent = `${viewDate.getFullYear()}年 ${viewDate.getMonth() + 1}月`;
        elements.overviewEyebrow.textContent = currentMonth ? "今月の予算" : `${viewDate.getMonth() + 1}月の予算`;
        elements.remainingLabel.textContent = remaining >= 0 ? "あと使える金額" : "予算を超えた金額";
        elements.remainingAmount.classList.toggle("is-over", remaining < 0);
        elements.remainingAmount.innerHTML = `${formatYen(remaining)}<span class="remaining-unit">円</span>`;

        if (currentMonth && remaining >= 0) {
          elements.remainingContext.innerHTML = `残り <strong>${daysLeft}日</strong>。1日あたり <strong>${formatYen(remaining / daysLeft)}</strong> が目安です。`;
        } else if (remaining < 0) {
          elements.remainingContext.textContent = `${formatYen(budget)}の予算を超えています。内訳から見直す項目を選べます。`;
        } else {
          elements.remainingContext.innerHTML = `予算 <strong>${formatYen(budget)}</strong> のうち、<strong>${formatYen(expenseTotal)}</strong> を使いました。`;
        }

        const spentPercent = Math.round(spentRatio * 100);
        elements.paceFill.style.width = `${Math.min(100, Math.max(0, spentRatio * 100))}%`;
        elements.paceFill.classList.toggle("is-over", spentRatio > 1);
        elements.todayMarker.style.left = `${Math.min(100, Math.max(0, elapsedRatio * 100))}%`;
        elements.todayMarker.hidden = !currentMonth;
        elements.paceRatio.textContent = `予算の ${spentPercent}%`;
        elements.paceTrack.setAttribute("aria-label", `予算の${spentPercent}パーセントを使用`);

        elements.paceMessage.classList.toggle("is-over", paceGap < 0 || spentRatio > 1);
        if (!expenses.length) {
          elements.paceMessageText.textContent = "まだ支出はありません。最初の記録を追加するとペースが見えます。";
        } else if (currentMonth && paceGap >= 0) {
          elements.paceMessageText.textContent = `今日までの目安より ${formatYen(paceGap)} ゆとりがあります。`;
        } else if (currentMonth) {
          elements.paceMessageText.textContent = `今日までの目安を ${formatYen(paceGap)} 上回っています。`;
        } else if (spentRatio <= 1) {
          elements.paceMessageText.textContent = `予算内に収まり、${formatYen(remaining)} 残りました。`;
        } else {
          elements.paceMessageText.textContent = `予算を ${formatYen(remaining)} 超えました。`;
        }

        elements.expenseTotal.textContent = formatYen(expenseTotal);
        elements.dailyBudget.textContent = currentMonth && remaining > 0 ? formatYen(remaining / daysLeft) : "—";
        elements.transactionCount.textContent = `${list.length}件`;
        elements.ledgerCount.textContent = `支出 ${formatYen(expenseTotal)}${incomeTotal ? ` ／ 収入 ${formatYen(incomeTotal)}` : ""}`;

        renderCategories(expenses, expenseTotal);
        renderFilters(list);
        renderTransactions(list);
      }

      function renderCategories(expenses, total) {
        const totals = Object.keys(expenseCategories).map((key) => ({
          key,
          ...expenseCategories[key],
          amount: expenses.filter((item) => item.category === key).reduce((sum, item) => sum + Number(item.amount || 0), 0)
        })).filter((item) => item.amount > 0).sort((a, b) => b.amount - a.amount);

        elements.categoryList.replaceChildren();
        elements.categoryNote.textContent = totals.length ? `上位 ${Math.min(4, totals.length)}項目` : "記録なし";

        if (!totals.length) {
          const item = document.createElement("li");
          item.className = "section-note";
          item.textContent = "支出を記録すると、ここに内訳が表示されます。";
          elements.categoryList.append(item);
          return;
        }

        totals.slice(0, 4).forEach((category) => {
          const item = document.createElement("li");
          item.className = "category-row";
          item.style.setProperty("--category-color", category.color);
          item.style.setProperty("--category-width", `${total > 0 ? Math.max(3, category.amount / total * 100) : 0}%`);

          const name = document.createElement("span");
          name.className = "category-name";
          const swatch = document.createElement("span");
          swatch.className = "category-swatch";
          swatch.setAttribute("aria-hidden", "true");
          name.append(swatch, document.createTextNode(category.label));

          const bar = document.createElement("span");
          bar.className = "category-bar";
          bar.setAttribute("aria-label", `${category.label} ${Math.round(category.amount / total * 100)}パーセント`);
          bar.append(document.createElement("span"));

          const amount = document.createElement("span");
          amount.className = "category-amount";
          amount.textContent = formatYen(category.amount);

          item.append(name, bar, amount);
          elements.categoryList.append(item);
        });
      }

      function renderFilters(list) {
        const presentExpenseKeys = Object.keys(expenseCategories).filter((key) => list.some((item) => item.type === "expense" && item.category === key));
        const filters = [
          { key: "all", label: "すべて" },
          ...presentExpenseKeys.map((key) => ({ key, label: expenseCategories[key].label })),
          ...(list.some((item) => item.type === "income") ? [{ key: "income", label: "収入" }] : [])
        ];

        if (!filters.some((item) => item.key === activeFilter)) activeFilter = "all";
        elements.filters.replaceChildren();
        filters.forEach((filter) => {
          const button = document.createElement("button");
          button.className = "filter-button";
          button.type = "button";
          button.textContent = filter.label;
          button.setAttribute("aria-pressed", String(activeFilter === filter.key));
          button.addEventListener("click", () => {
            activeFilter = filter.key;
            render();
          });
          elements.filters.append(button);
        });
      }

      function renderTransactions(list) {
        const filtered = list.filter((item) => {
          if (activeFilter === "all") return true;
          if (activeFilter === "income") return item.type === "income";
          return item.type === "expense" && item.category === activeFilter;
        });

        elements.transactionGroups.replaceChildren();
        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const mark = document.createElement("span");
          mark.className = "empty-state-mark";
          mark.setAttribute("aria-hidden", "true");
          const title = document.createElement("h3");
          title.textContent = activeFilter === "all" ? "この月の記録はありません" : "該当する記録はありません";
          const copy = document.createElement("p");
          copy.textContent = activeFilter === "all" ? "下の「支出を記録する」から、最初の1件を追加できます。" : "別のカテゴリに切り替えると記録を確認できます。";
          empty.append(mark, title, copy);
          elements.transactionGroups.append(empty);
          return;
        }

        const groups = new Map();
        filtered.forEach((item) => {
          if (!groups.has(item.date)) groups.set(item.date, []);
          groups.get(item.date).push(item);
        });

        groups.forEach((items, dateString) => {
          const parsedDate = new Date(`${dateString}T12:00:00`);
          const group = document.createElement("section");
          group.className = "date-group";

          const heading = document.createElement("h2");
          heading.className = "date-heading";
          const day = document.createElement("strong");
          day.textContent = parsedDate.getDate();
          heading.append(day, document.createTextNode(`${dateFormatter.format(parsedDate)}曜日`));

          const transactionList = document.createElement("ul");
          transactionList.className = "transactions";

          items.forEach((item) => {
            const category = categoryFor(item);
            const listItem = document.createElement("li");
            listItem.className = "transaction-item";
            const button = document.createElement("button");
            button.className = "transaction-button";
            button.type = "button";
            button.style.setProperty("--category-color", category.color);
            button.setAttribute("aria-label", `${item.memo || category.label}、${formatYen(item.amount)}、編集`);
            button.addEventListener("click", () => openEntryDialog(item.type, item));

            const mark = document.createElement("span");
            mark.className = "transaction-mark";
            mark.setAttribute("aria-hidden", "true");

            const content = document.createElement("span");
            content.className = "transaction-content";
            const name = document.createElement("span");
            name.className = "transaction-name";
            name.textContent = item.memo || category.label;
            const meta = document.createElement("span");
            meta.className = "transaction-meta";
            meta.textContent = `${category.label} · タップして編集`;
            content.append(name, meta);

            const amount = document.createElement("span");
            amount.className = `transaction-amount${item.type === "income" ? " is-income" : ""}`;
            amount.textContent = `${item.type === "income" ? "+" : "−"}${formatYen(item.amount)}`;

            button.append(mark, content, amount);
            listItem.append(button);
            transactionList.append(listItem);
          });

          group.append(heading, transactionList);
          elements.transactionGroups.append(group);
        });
      }

      function setEntryType(type) {
        entryType = type;
        const expense = type === "expense";
        elements.typeExpense.setAttribute("aria-pressed", String(expense));
        elements.typeIncome.setAttribute("aria-pressed", String(!expense));
        elements.entryDialogTitle.textContent = editingId ? `${expense ? "支出" : "収入"}を編集` : `${expense ? "支出" : "収入"}を記録`;
        elements.entrySubmit.textContent = editingId ? "変更を保存" : "記録する";

        const categories = expense ? expenseCategories : incomeCategories;
        if (!categories[selectedCategory]) selectedCategory = Object.keys(categories)[0];
        renderCategoryChoices(categories);
      }

      function renderCategoryChoices(categories) {
        elements.categoryChoices.replaceChildren();
        Object.entries(categories).forEach(([key, category]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "category-choice";
          button.textContent = category.label;
          button.style.setProperty("--category-color", category.color);
          button.setAttribute("aria-pressed", String(selectedCategory === key));
          button.addEventListener("click", () => {
            selectedCategory = key;
            renderCategoryChoices(categories);
          });
          elements.categoryChoices.append(button);
        });
      }

      function defaultEntryDate() {
        const now = new Date();
        if (isCurrentCalendarMonth()) return toDateString(now);
        return toDateString(new Date(viewDate.getFullYear(), viewDate.getMonth(), 1));
      }

      function openEntryDialog(type = "expense", item = null) {
        editingId = item ? item.id : null;
        elements.entryForm.reset();
        elements.formError.textContent = "";
        elements.amount.value = item ? numberFormatter.format(item.amount) : "";
        elements.memo.value = item ? item.memo || "" : "";
        elements.date.value = item ? item.date : defaultEntryDate();
        selectedCategory = item ? item.category : (type === "expense" ? "food" : "salary");
        elements.deleteEntry.hidden = !item;
        setEntryType(type);
        elements.entryDialog.showModal();
        window.setTimeout(() => elements.amount.focus(), 70);
      }

      function closeEntryDialog() {
        elements.entryDialog.close();
        editingId = null;
      }

      function submitEntry(event) {
        event.preventDefault();
        const wasEditing = Boolean(editingId);
        const amount = parseAmount(elements.amount.value);
        const date = elements.date.value;
        if (!Number.isFinite(amount) || amount <= 0) {
          elements.formError.textContent = "1円以上の金額を入力してください。";
          elements.amount.focus();
          return;
        }
        if (!date) {
          elements.formError.textContent = "日付を選んでください。";
          elements.date.focus();
          return;
        }

        const entry = {
          id: editingId || `entry-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          type: entryType,
          amount,
          category: selectedCategory,
          memo: elements.memo.value.trim(),
          date,
          createdAt: editingId ? (state.transactions.find((item) => item.id === editingId)?.createdAt || Date.now()) : Date.now()
        };

        if (editingId) {
          state.transactions = state.transactions.map((item) => item.id === editingId ? entry : item);
        } else {
          state.transactions.push(entry);
        }

        const [year, month] = date.split("-").map(Number);
        viewDate = new Date(year, month - 1, 1);
        activeFilter = "all";
        saveState();
        render();
        closeEntryDialog();
        showToast(wasEditing ? "変更を保存しました" : `${entryType === "expense" ? "支出" : "収入"}を記録しました`);
      }

      function deleteEntry() {
        if (!editingId) return;
        const item = state.transactions.find((entry) => entry.id === editingId);
        const label = item?.memo || categoryFor(item || { type: "expense", category: "other" }).label;
        if (!window.confirm(`「${label}」の記録を削除しますか？`)) return;
        state.transactions = state.transactions.filter((entry) => entry.id !== editingId);
        saveState();
        render();
        closeEntryDialog();
        showToast("記録を削除しました");
      }

      function openSettings() {
        elements.settingsError.textContent = "";
        elements.settingsCopy.textContent = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月に、生活費として使ってよい金額を設定します。収入とは別に考えると、残りが分かりやすくなります。`;
        elements.budget.value = numberFormatter.format(currentBudget());
        elements.settingsDialog.showModal();
        window.setTimeout(() => elements.budget.focus(), 70);
      }

      function submitSettings(event) {
        event.preventDefault();
        const budget = parseAmount(elements.budget.value);
        if (!Number.isFinite(budget) || budget <= 0) {
          elements.settingsError.textContent = "1円以上の予算を入力してください。";
          elements.budget.focus();
          return;
        }
        state.budgets[monthKey(viewDate)] = budget;
        saveState();
        render();
        elements.settingsDialog.close();
        showToast("予算を保存しました");
      }

      function changeMonth(offset) {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + offset, 1);
        activeFilter = "all";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function formatNumericInput(input) {
        const caretAtEnd = input.selectionStart === input.value.length;
        const amount = parseAmount(input.value);
        input.value = amount ? numberFormatter.format(amount) : "";
        if (caretAtEnd) input.setSelectionRange(input.value.length, input.value.length);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add("is-visible");
        toastTimer = window.setTimeout(() => elements.toast.classList.remove("is-visible"), 2300);
      }

      document.querySelector("#prev-month").addEventListener("click", () => changeMonth(-1));
      document.querySelector("#next-month").addEventListener("click", () => changeMonth(1));
      document.querySelector("#add-expense").addEventListener("click", () => openEntryDialog("expense"));
      document.querySelector("#add-income").addEventListener("click", () => openEntryDialog("income"));
      document.querySelector("#entry-close").addEventListener("click", closeEntryDialog);
      document.querySelector("#entry-cancel").addEventListener("click", closeEntryDialog);
      elements.typeExpense.addEventListener("click", () => setEntryType("expense"));
      elements.typeIncome.addEventListener("click", () => setEntryType("income"));
      elements.entryForm.addEventListener("submit", submitEntry);
      elements.deleteEntry.addEventListener("click", deleteEntry);
      elements.amount.addEventListener("input", () => formatNumericInput(elements.amount));
      document.querySelector("#settings-trigger").addEventListener("click", openSettings);
      document.querySelector("#budget-edit").addEventListener("click", openSettings);
      document.querySelector("#settings-close").addEventListener("click", () => elements.settingsDialog.close());
      document.querySelector("#settings-cancel").addEventListener("click", () => elements.settingsDialog.close());
      elements.settingsForm.addEventListener("submit", submitSettings);
      elements.budget.addEventListener("input", () => formatNumericInput(elements.budget));

      elements.entryDialog.addEventListener("click", (event) => {
        if (event.target === elements.entryDialog) closeEntryDialog();
      });
      elements.settingsDialog.addEventListener("click", (event) => {
        if (event.target === elements.settingsDialog) elements.settingsDialog.close();
      });

      render();
    })();
  </script>
</body>
</html>
